version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resqioticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  app:
    image: ${IMAGE_NAME:-resqioticket:latest}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resqioticket
      RESEND_API_KEY: ${RESEND_API_KEY}
      API_KEY: ${API_KEY:-default-dev-api-key}
      APP_URL: ${APP_URL:-http://localhost:3000}
      EMAIL_FROM: ${EMAIL_FROM:-support@yourdomain.com}
      CRON_SECRET: ${CRON_SECRET:-default-cron-secret}
      REMINDER_INTERVAL_HOURS: ${REMINDER_INTERVAL_HOURS:-24}
      REMINDER_ESCALATION_DAYS: ${REMINDER_ESCALATION_DAYS:-3}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:-}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

volumes:
  postgres_data:
    driver: local
